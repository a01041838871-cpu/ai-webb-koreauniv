<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일본회화의 문화학</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261004b">
  <link rel="stylesheet" href="admin.css?v=20261004b">
  <!-- 모든 내용은 config.js 에서 수정하세요 (또는 오른쪽 위 🔒 관리자 화면) -->
  <script src="config.js?v=20261004b"></script>
  <script src="store.js?v=20261004b"></script>
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>

  <!-- 맨 위 알림 띠 (config.js 의 banner) -->
  <div class="top-banner" id="topBanner" hidden></div>

  <!-- 상단 고정 메뉴 -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a href="#top" class="brand">
        <span class="brand-icon" id="brandIcon"></span>
        <span class="brand-text"><strong id="brandText"></strong><small id="brandSub"></small></span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero"></section>
    <section class="section" id="notice" hidden></section>
    <section class="section" id="curriculum"></section>
    <section class="section" id="about"></section>
    <section class="section" id="course"></section>
    <section class="section" id="guide"></section>
    <section class="section" id="join"></section>
    <section class="section" id="myroom"></section>
    <section class="section" id="faq"></section>
  </main>

  <!-- 푸터: 수강준비물 · 교수자 · 연락처 (메뉴 '교수자'가 이곳으로 이동) -->
  <footer class="footer" id="professors"></footer>

  <!-- 상세 보기 팝업 -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="닫기">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <button class="to-top" id="toTop" aria-label="맨 위로">↑</button>

  <script src="app.js?v=20261004b"></script>
  <script src="admin.js?v=20261004b"></script>
</body>
</html>
